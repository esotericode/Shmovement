name: Godot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Fetch and verify CC0 character assets
        run: python3 tools/fetch_character.py
      - name: Import, launch, and run physics integration checks
        run: python3 tests/validate.py "$RUNNER_TEMP/godot"
      - name: Capture rendered review images
        run: |
          set -euo pipefail
          xvfb-run -a "$RUNNER_TEMP/godot" --path . --audio-driver Dummy --rendering-method gl_compatibility --script tests/capture_preview.gd 2>&1 | tee "$RUNNER_TEMP/render.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/render.log"; then exit 1; fi
      - name: Bundle ready-to-open project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          root = Path(".")
          paths = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          paths.update(str(p) for p in (root / "assets" / "character").glob("*") if p.is_file())
          paths.update(str(p) for p in (root / "test-results" / "screenshots").glob("*.png"))
          with zipfile.ZipFile("Shmovement-Godot-4.7.2.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(paths):
                  archive.write(path, "Shmovement/" + path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Shmovement-Godot-4.7.2
          path: Shmovement-Godot-4.7.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: character-and-playground-previews
          path: test-results/screenshots/
